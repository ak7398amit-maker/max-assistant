name: Build Max APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q ./*.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: proj/MaxAssistant
        run: gradle assembleDebug --stacktrace
      - name: Rename
        run: cp proj/MaxAssistant/app/build/outputs/apk/debug/app-debug.apk Max-Assistant.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Max Assistant (latest build)
          files: Max-Assistant.apk
